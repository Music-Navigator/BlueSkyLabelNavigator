<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BlueSkyLabelのクラシック音源を検索し、作品・楽器・編成などからたどるための案内ページ。">
  <title>BlueSkyLabel Navigator（仮）</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-title" href="index.html">BlueSkyLabel Navigator</a>
      <nav class="site-nav" aria-label="主要ナビゲーション">
        <a href="#search">検索</a>
        <a href="#paths">探し方</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="search-section" id="search">
      <div class="shell content-narrow">
        <h1>音源を探す</h1>

        <p>検索機能はパイロット版では準備中です。</p>
      </div>
    </section>

    <section class="paths-section" id="paths">
      <div class="shell">
        <div class="section-heading">
          <h2>探し方</h2>
        </div>

        <div class="path-list">
          <article class="path-item">
            <h3><a href="pages/beautiful-melody-01.html">美しい旋律</a></h3>
            <p>印象に残る旋律から作品を探します。</p>
          </article>

          <article class="path-item">
            <h3><a href="pages/masterpiece-01-pastoral.html">名曲</a></h3>
            <p>作品ごとに音源をまとめます。</p>
          </article>

          <article class="path-item">
            <h3>楽器</h3>
            <p>楽器から作品を探します。</p>
          </article>

          <article class="path-item">
            <h3>演奏編成</h3>
            <p>独奏、室内楽、管弦楽など。</p>
          </article>

          <article class="path-item">
            <h3>映画</h3>
            <p>映画で使われたクラシック。</p>
          </article>
        </div>
      </div>
    </section>

    <section class="source-note">
      <div class="shell content-narrow">
        <p>音源の再生はBlueSkyLabel本体で行います。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell">
      <p>非営利の案内ページです。</p>
    </div>
  </footer>
</body>
</html>
