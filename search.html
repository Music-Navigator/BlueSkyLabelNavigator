<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Blue Sky Labelのクラシック音源を、作曲家、作品名、作品番号、演奏家から検索します。">
  <title>検索｜BlueSkyLabel Navigator</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .search-page { padding: 3rem 0 5rem; }
    .search-page .narrow { max-width: 900px; }
    .search-page h1 { font-size: 1.8rem; line-height: 1.25; }
    .search-page .search-form { margin-top: 2rem; }
    .search-status { margin: 2.5rem 0 1.25rem; color: var(--muted); }
    .search-result-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid #d8d3ca; }
    .search-result-item { display: grid; grid-template-columns: 5rem minmax(8rem, 13rem) minmax(0, 1fr); gap: 1rem; align-items: baseline; padding: 1rem 0; border-bottom: 1px solid #d8d3ca; }
    .search-result-kind { color: var(--muted); font-size: 0.8rem; }
    .search-result-composer { color: var(--muted); font-size: 0.92rem; }
    .search-result-item a { color: var(--link); text-underline-offset: 4px; }
    @media (max-width: 620px) {
      .search-page h1 { font-size: 1.7rem; }
      .search-result-item { grid-template-columns: 4rem minmax(0, 1fr); gap: 0.35rem 0.75rem; }
      .search-result-composer { grid-column: 2; }
      .search-result-item a { grid-column: 2; }
    }
  </style>
  <script src="assets/search/search-index.js" defer></script>
  <script src="assets/js/search.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-title" href="index.html">BlueSkyLabel Navigator</a>
      <nav class="site-nav" aria-label="主要ナビゲーション"><a href="index.html">トップ</a></nav>
    </div>
  </header>
  <main class="search-page">
    <div class="shell narrow">
      <nav class="breadcrumb" aria-label="パンくず">
        <a href="index.html">トップ</a>
        <span>/</span>
        <span>検索</span>
      </nav>
      <h1>音源を探す</h1>
      <form class="search-form" action="search.html" method="get" role="search" data-search-form>
        <label class="visually-hidden" for="search-query">音源検索</label>
        <input id="search-query" name="q" type="search" placeholder="作曲家（英語可）・作品名（日本語推奨）・作品番号（例：304）" autocomplete="off" data-search-input>
        <button type="submit">検索</button>
      </form>
      <p class="search-status" role="status" aria-live="polite" data-search-status></p>
      <ul class="search-result-list" data-search-results></ul>
    </div>
  </main>
  <footer class="site-footer">
    <div class="shell"><p>クラシック音源と楽譜への道筋を整理する、非営利の案内ページです。</p></div>
  </footer>
</body>
</html>
